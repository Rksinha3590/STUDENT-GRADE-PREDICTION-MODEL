{% extends 'adminlay.html' %}

{% block title %}Show Messages{% endblock %}

{% block content %}


<div class="container-fluid">
    <h1 class="text-center alert alert-danger">Show Messages Details</h1>
            <div class="row">
                <div class="col-sm-2"></div>
    
                <!-- content goes here -->
                <div class="col-sm-8">
    <table class="table table-hover text-white">
        <thead>
            <tr>
                <th scope="col">S/N</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Message</th>
            </tr>
        </thead>
        <tbody>
            {% for row in contactus %}
            <tr>
            <td>{{row.0}}</td>
            <td>{{row.1}}</td>
            <td>{{row.2}}</td>
            <td>{{row.3}}</td>
           
        </tr>
            {% endfor %}
        </tbody>
    
    </table>
                </div>
                <!-- Content ends here-->
    
                <div class="col-sm-2"></div>
    
            </div>
        </div>
    
</div>

{% endblock %}
